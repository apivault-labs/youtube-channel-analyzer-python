[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "youtube-channel-analyzer"
version = "0.1.0"
description = "Python SDK for YouTube Channel Analyzer on Apify. Analyze YouTube channels in bulk by handle, URL, ID, or video. Get subscribers, views, estimated earnings, growth, audience signals, recent videos, competitors, and forecasts. No login or cookies. Pay per result: $1/1K on paid plans. Export JSON, CSV"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "ApiVault Labs" }]
requires-python = ">=3.9"
dependencies = ["requests>=2.31.0"]
keywords = ["youtube", "youtube-analytics", "channel-analyzer", "earnings-estimate", "growth-analysis", "creator-economy", "apify", "python-sdk"]

[project.urls]
Homepage = "https://github.com/apivault-labs/youtube-channel-analyzer-python"
Documentation = "https://github.com/apivault-labs/youtube-channel-analyzer-python#readme"
"Apify Actor" = "https://apify.com/apivault_labs/youtube-channel-stats"
"Bug Tracker" = "https://github.com/apivault-labs/youtube-channel-analyzer-python/issues"

[tool.setuptools.packages.find]
include = ["youtube_channel_analyzer*"]
